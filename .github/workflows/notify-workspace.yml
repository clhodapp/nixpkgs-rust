# SPDX-License-Identifier: MIT
#
# After a push to main, this workflow asks the maintainer's workspace
# repository (clhodapp/ch-nix-workspace, private) to run its `converge`
# workflow, which re-pins this repository in the flakes that consume it.
# The credential is a one-hour installation token minted per run from a
# GitHub App that holds only Actions read/write on the workspace
# repository: it can start workflow runs there and cannot touch the
# repository's contents. The job runs only in repositories owned by
# clhodapp, so a fork's push to its own main skips it. Pushes of pin
# updates are the converge run's own output and are skipped as well,
# since dispatching for them would only queue a run with nothing to do.

name: notify-workspace

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: "github.repository_owner == 'clhodapp' && !startsWith(github.event.head_commit.message, 'maint: update flake pins')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the dispatch app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKSPACE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_DISPATCH_APP_PRIVATE_KEY }}
          owner: clhodapp
          repositories: ch-nix-workspace

      - name: Trigger converge on ch-nix-workspace
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/clhodapp/ch-nix-workspace/actions/workflows/converge.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"source_repo\":\"${GITHUB_REPOSITORY}\",\"source_sha\":\"${GITHUB_SHA}\"}}"
